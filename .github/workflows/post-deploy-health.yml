name: Post Deploy Health

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL publica a verificar (https://...)
        required: true
        type: string
  schedule:
    - cron: '15 11 * * *'

jobs:
  release-health-check:
    name: Release Health Check
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve target URL
        id: resolve-url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ vars.PRODUCTION_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release health
        run: node scripts/check-release-health.mjs --url "${{ steps.resolve-url.outputs.url }}"
