<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <rect width="512" height="512" rx="100" fill="#0284c7"/>
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#g)"/>
  <!-- Truck icon (simplified) -->
  <!-- Truck body -->
  <rect x="80" y="210" width="260" height="140" rx="12" fill="white"/>
  <!-- Truck cab -->
  <rect x="340" y="240" width="100" height="110" rx="10" fill="white"/>
  <!-- Cab window -->
  <rect x="354" y="252" width="72" height="52" rx="6" fill="#0284c7"/>
  <!-- Cargo door line -->
  <line x1="80" y1="280" x2="340" y2="280" stroke="#0284c7" stroke-width="6"/>
  <!-- Wheels -->
  <circle cx="150" cy="358" r="36" fill="#1e293b"/>
  <circle cx="150" cy="358" r="18" fill="white"/>
  <circle cx="310" cy="358" r="36" fill="#1e293b"/>
  <circle cx="310" cy="358" r="18" fill="white"/>
  <circle cx="415" cy="358" r="30" fill="#1e293b"/>
  <circle cx="415" cy="358" r="14" fill="white"/>
  <!-- Speed lines -->
  <rect x="35" y="250" width="30" height="6" rx="3" fill="white" opacity="0.7"/>
  <rect x="20" y="268" width="45" height="6" rx="3" fill="white" opacity="0.5"/>
  <rect x="30" y="286" width="25" height="6" rx="3" fill="white" opacity="0.4"/>
  <!-- Package / box on top of truck -->
  <rect x="120" y="165" width="80" height="50" rx="6" fill="#fbbf24"/>
  <line x1="160" y1="165" x2="160" y2="215" stroke="#f59e0b" stroke-width="3"/>
  <line x1="120" y1="190" x2="200" y2="190" stroke="#f59e0b" stroke-width="3"/>
</svg>
